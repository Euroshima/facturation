name: Release (Windows exe)

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # 3.13 est trop récent pour PyInstaller parfois

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --onefile --noconsole main.py

      - name: Compute version from file
        id: get_version
        run: echo "version=$(python -c 'from src.core.version import __version__; print(__version__)')" >> $env:GITHUB_OUTPUT

      - name: Rename artifact
        run: mv dist/main.exe dist/facturation-${{ steps.get_version.outputs.version }}.exe

      - name: Upload exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
