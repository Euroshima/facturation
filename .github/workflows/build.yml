name: Release (Windows app)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # <— donne le droit de publier la release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      - name: Compute version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Build minimal (= celui qui fonctionnait avant). psycopg2 est embarqué
      # par le hook automatique de PyInstaller ; pas de --icon ni --version-file
      # (une ressource PE mal formée peut empêcher le chargement de l'exe).
      - name: Build exe with PyInstaller
        run: >
          pyinstaller
          --onefile
          --noconsole
          --clean
          --paths=src
          --add-data "CHANGELOG.md;."
          --add-data "assets;assets"
          -n Facturation
          main.py

      # Variante AVEC console : fenêtre qui affiche le journal de démarrage
      # étape par étape (facturation-boot.log) pour localiser un blocage.
      - name: Build debug exe (console)
        run: >
          pyinstaller
          --onefile
          --console
          --clean
          --paths=src
          --add-data "CHANGELOG.md;."
          --add-data "assets;assets"
          -n Facturation-debug
          main.py

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Facturation.exe")) { throw "dist/Facturation.exe est introuvable" }
          if (-not (Test-Path "dist/Facturation-debug.exe")) { throw "dist/Facturation-debug.exe est introuvable" }
          (Get-Item "dist/Facturation.exe").Length
          (Get-Item "dist/Facturation-debug.exe").Length

      # Noms simples et STABLES : Facturation.exe / Facturation-debug.exe.
      # La version est portée par le tag et le titre de la release, et affichée
      # dans l'appli. Un nom fixe évite que le fichier « mente » après une
      # mise à jour automatique (qui remplace le contenu, pas le nom).
      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item dist/Facturation.exe out/Facturation.exe
          Copy-Item dist/Facturation-debug.exe out/Facturation-debug.exe
          # Empreinte publiée avec la release, pour vérifier le téléchargement.
          $h = (Get-FileHash out/Facturation.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Facturation.exe" | Out-File -Encoding ascii out/Facturation.exe.sha256

      # La variante debug sert au diagnostic interne : artefact du workflow
      # (accès réservé aux collaborateurs), pas fichier de la release publique.
      - name: Keep debug exe as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Facturation-debug
          path: out/Facturation-debug.exe
          retention-days: 30

      - name: Upload exe to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            out/Facturation.exe
            out/Facturation.exe.sha256
          tag_name: v${{ steps.ver.outputs.version }}
          name: "Facturation v${{ steps.ver.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
