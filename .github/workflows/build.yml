name: Release (Windows exe)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # <— donne le droit de publier la release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe with PyInstaller
        run: pyinstaller --onefile --noconsole --paths=src --collect-submodules psycopg2 main.py -n Facturation

      - name: Compute version from file
        id: ver
        run: |
          echo "version=$(python -c 'import sys; sys.path.insert(0, \"src\"); from core.version import __version__; print(__version__)')" >> $env:GITHUB_OUTPUT

      - name: Rename artifact
        run: |
          mkdir out
          mv dist/Facturation.exe out/Facturation-${{ steps.ver.outputs.version }}.exe

      - name: Upload exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/Facturation-${{ steps.ver.outputs.version }}.exe
          tag_name: v${{ steps.ver.outputs.version }}
          name: "Facturation v${{ steps.ver.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
