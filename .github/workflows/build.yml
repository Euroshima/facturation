name: Release (Windows exe)

on:
  push:
    tags:
      - 'v*'   # se déclenche sur push de tag v1.2.3

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt || echo "no requirements.txt"

      - name: Build exe with PyInstaller
        run: pyinstaller --clean -y main.spec

      - name: Compute version from file
        id: ver
        shell: pwsh
        run: |
          $content = Get-Content "src/core/version.py" -Raw
          $match = [regex]::Match($content, '__version__\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Version not found" }
          echo "version=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Rename artifact
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Rename-Item "dist/Facturation.exe" "dist/Facturation-$ver.exe"

      - name: Upload exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Facturation-${{ steps.ver.outputs.version }}*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
